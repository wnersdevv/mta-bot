<svg width="1000" height="260" viewBox="0 0 1000 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="50%" stop-color="#203a43"/>
      <stop offset="100%" stop-color="#2c5364"/>
    </linearGradient>
    <linearGradient id="title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6ec4"/>
      <stop offset="25%" stop-color="#f5c518"/>
      <stop offset="50%" stop-color="#57f287"/>
      <stop offset="75%" stop-color="#1abc9c"/>
      <stop offset="100%" stop-color="#5dade2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1000" height="260" rx="20" fill="url(#bg)"/>

  <!-- decorative grid lines, Vice-City-at-night vibe -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="60" x2="1000" y2="60"/>
    <line x1="0" y1="120" x2="1000" y2="120"/>
    <line x1="0" y1="180" x2="1000" y2="180"/>
    <line x1="150" y1="0" x2="150" y2="260"/>
    <line x1="450" y1="0" x2="450" y2="260"/>
    <line x1="750" y1="0" x2="750" y2="260"/>
  </g>

  <text x="500" y="115" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="64" fill="url(#title)" filter="url(#glow)" letter-spacing="4">
    WNERSDEV
  </text>
  <text x="500" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="26" fill="#ffffff" letter-spacing="2">
    🎮 GTA ONLINE DISCORD BOT
  </text>
  <text x="500" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#9fb3c8" letter-spacing="1">
    Türkçe komutlar • 4 dilli • MongoDB + Prisma • TypeScript
  </text>

  <!-- flag emojis as colored dots since emoji doesn't always render in SVG text reliably on GitHub -->
  <g font-family="Arial, sans-serif" font-size="14" fill="#e5e7eb">
    <circle cx="330" cy="228" r="4" fill="#e30a17"/>
    <text x="342" y="233">Türkçe</text>
    <circle cx="420" cy="228" r="4" fill="#012169"/>
    <text x="432" y="233">English</text>
    <circle cx="515" cy="228" r="4" fill="#ffcc00"/>
    <text x="527" y="233">Deutsch</text>
    <circle cx="610" cy="228" r="4" fill="#aa151b"/>
    <text x="622" y="233">Español</text>
  </g>
</svg>
